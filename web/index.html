<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Numero Shastra</title>
  <meta name="description" content="Manage and place product orders with ease using Numero Shastra.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://app.numeroshastra.com/">
  <meta property="og:title" content="Numero Shastra">
  <meta property="og:description" content="Browse products, manage your cart, and place orders seamlessly.">
  <meta property="og:image" content="https://app.numeroshastra.com/app_logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://app.numeroshastra.com/">
  <meta property="twitter:title" content="Numero Shastra">
  <meta property="twitter:description" content="Browse products, manage your cart, and place orders seamlessly.">
  <meta property="twitter:image" content="https://app.numeroshastra.com/app_logo.png">

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="app_logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google tag (gtag.js) - Analytics for PWA -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GDY7TP00R2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-GDY7TP00R2');
  </script>

  <!-- Meta Pixel Code -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = '2.0';
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1944589032861359');
    fbq('track', 'PageView');

    try {
      const urlParams = new URLSearchParams(window.location.search);
      const campaign = urlParams.get('utm_campaign') || 'untracked';
      fbq('track', 'ViewContent', {
        brand_name: 'Numero Shastra',
        device_detected: 'ios',
        campaign: campaign
      });
    } catch (e) {
      console.error('Failed to parse campaign parameters for Meta:', e);
    }
  </script>
  <!-- End Meta Pixel Code -->
</head>

<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
